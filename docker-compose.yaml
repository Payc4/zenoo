# Local development with Docker: `docker compose up`, then open http://localhost:8080.
# Production runs the single-container Dockerfile on Coolify instead (see DEPLOY.md).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-dev-secret-not-for-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: "mysql://zenoo:${MYSQL_PASSWORD:-zenoo_local}@database:3306/zenoo?serverVersion=8.0.32&charset=utf8mb4"
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 5s
      retries: 3

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zenoo
      MYSQL_USER: zenoo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zenoo_local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database_data:/var/lib/mysql:rw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

volumes:
  database_data:
