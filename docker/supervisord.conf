; Supervisor owns PID 1 in this container and runs nginx, PHP-FPM and the
; Messenger worker as one supervised tree.
;
; The previous setup started nginx and supervisord with `&` from the entrypoint
; and exec'd php-fpm. That left nginx unsupervised: if it died, PHP-FPM kept
; running, the container stayed "up", and the site was simply unreachable until
; someone noticed. Here every process is restartable and a crash is visible.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

; Enables `docker exec <container> supervisorctl status` in production — check
; whether the worker is alive, or restart it, without redeploying.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; PHP-FPM listens on 127.0.0.1:9000, which is what nginx's fastcgi_pass targets
; once the Dockerfile rewrites the upstream.
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Consumes `async`, the only application transport in config/packages/messenger.yaml.
; Mailer and Notifier messages are routed to it, so while this worker is down no
; email leaves the app — messages just accumulate in the messenger_messages table
; and send once it comes back.
;
; --time-limit and --memory-limit make the worker exit deliberately and let
; supervisor restart it. That is the supported way to stop a long-running PHP
; process from accumulating leaked memory.
;
; The program name stays `messenger-consume` so the existing deploy.sh and
; check-messenger.sh keep working.
[program:messenger-consume]
command=php /var/www/html/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -v
directory=/var/www/html
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=0
; Give an in-flight message time to finish before SIGKILL on shutdown.
stopwaitsecs=15
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
