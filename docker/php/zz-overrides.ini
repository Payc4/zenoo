; Loaded from $PHP_INI_DIR/conf.d. The zz- prefix keeps it last in the include
; order, so these values win over the base image's defaults and over anything an
; extension drops in alongside them.

; Don't advertise the PHP version in response headers.
expose_php = Off

; Profile photos (app cap 5 MB) and chat attachments (up to 3 per message, 10 MB each).
;
; post_max_size is deliberately larger than upload_max_filesize: the multipart
; body carries the file plus the other form fields and the boundary overhead, so
; setting both to 10M rejects an actual 10M file. nginx's client_max_body_size
; is matched to post_max_size.
upload_max_filesize = 10M
post_max_size = 32M
memory_limit = 256M

; Chat replies stream for up to a couple of minutes.
max_execution_time = 180
max_input_time = 60

; Opcache.
;
; validate_timestamps = 0 is safe here because the PHP in this image never
; changes after the build: the Composer classmap, the compiled Symfony container
; and the Doctrine proxies are all baked in by the Dockerfile. The one thing to
; know: if you run `bin/console cache:clear` inside a live container, restart
; PHP-FPM afterwards (`supervisorctl restart php-fpm`) or opcache will keep
; serving the compiled container you just deleted.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
