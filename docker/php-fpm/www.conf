; PHP-FPM pool overrides. Installed as zz-www.conf so it loads after the base
; image's /usr/local/etc/php-fpm.d/www.conf — for a repeated [www] section, the
; keys read last win.
;
; The base image ships pm.max_children = 5, which is the concurrent request
; ceiling for the entire site: six simultaneous readers and the sixth queues.
; Sized below for a ~1 GB container at roughly 50 MB per worker.

[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically so a slow leak in a long-lived process cannot
; accumulate across a deploy cycle.
pm.max_requests = 500

; Without this, anything a worker writes to stdout/stderr (including PHP fatals
; that never reach Monolog) is discarded instead of reaching `docker logs`.
catch_workers_output = yes
decorate_workers_output = no
