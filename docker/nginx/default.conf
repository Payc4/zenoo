# Shared by the production image and the two-container dev docker-compose.yaml.
#
# The fastcgi upstream below is written for dev, where PHP-FPM is a separate
# container named `app`. The Dockerfile rewrites that host to the loopback
# address when building the production image, in which nginx and PHP-FPM share a
# network namespace. Keep the directive on one line so that rewrite keeps
# matching.

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    server_tokens off;

    # Matches post_max_size in docker/php/zz-overrides.ini. nginx rejects an
    # oversized body before PHP sees it, so the two limits have to agree or the
    # pet parent gets a bare 413 instead of the app's own "photo too large" message.
    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No Content-Security-Policy yet. The site loads Cloudflare Turnstile, the quiz
    # posts to Klaviyo and loads Google Fonts, checkout redirects to Stripe, and
    # EasyAdmin relies on inline styles and scripts. Add a policy once those
    # sources have been checked against the real pages.

    # Each static location repeats X-Content-Type-Options: nginx only inherits
    # add_header while a block adds none of its own, so setting Cache-Control
    # would otherwise drop nosniff, which matters for /uploads/ (user files).

    # Asset Mapper output is content-hashed, so a long immutable cache is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Profile photos. Every file is re-encoded as JPEG by AvatarUploader and has
    # a random name, so a long cache is safe.
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Logos, product photos and the Bowl Score quiz's own files.
    location ~ ^/(images|quiz/assets)/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Chat replies stream (X-Accel-Buffering: no); allow long answers.
        fastcgi_read_timeout 180;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
