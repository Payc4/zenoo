<!-- ZENOO site email: "welcome" flow (event "ZENOO Welcome"). Paste into an HTML block. Works in every site language:
     all text comes from the event (copy_* properties, already translated by the site). -->
<div style="padding:8px 28px 4px;">
<h1 style="font-family:Helvetica,Arial,sans-serif;font-weight:800;font-size:24px;line-height:1.15;text-transform:uppercase;margin:0 0 14px;color:#445942;">{{ event.copy_heading }}</h1>
<p style="margin:0 0 12px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#2b2b2b;">{{ event.copy_intro }}</p>
<p style="margin:0 0 12px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#2b2b2b;">{{ event.copy_text }}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;"><tr><td style="border-radius:70px;background:#f7a223;"><a href="{{ event.quiz_url }}" style="display:inline-block;padding:14px 30px;font-family:Helvetica,Arial,sans-serif;font-weight:800;font-size:15px;letter-spacing:.03em;color:#ffffff;text-decoration:none;text-transform:uppercase;">{{ event.copy_button }}</a></td></tr></table>
<p style="margin:0 0 12px;font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#2b2b2b;">{{ event.copy_note }}</p>
</div>
