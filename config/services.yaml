parameters:
    app.url: '%env(APP_URL)%'
    app.turnstile.site_key: '%env(default::TURNSTILE_SITE_KEY)%'
    app.turnstile.secret_key: '%env(default::TURNSTILE_SECRET_KEY)%'
    app.mail.from_email: '%env(MAIL_FROM_EMAIL)%'
    app.mail.from_name: 'ZENOO'
    # Bowl Score quiz → Klaviyo. QUIZ_SEND_TO_KLAVIYO is true in .env, so finished quizzes go to the
    # LIVE "Dog Quiz – EN" flow and email a real address. The fallback below only applies if the
    # variable is missing entirely.
    app.quiz.klaviyo_company_id: '%env(default::KLAVIYO_COMPANY_ID)%'
    app.quiz.klaviyo_list_id: '%env(default::KLAVIYO_LIST_ID)%'
    app.quiz.send_to_klaviyo: '%env(bool:default:app.quiz.send_default:QUIZ_SEND_TO_KLAVIYO)%'
    app.quiz.send_default: false
    # The Lithuanian quiz goes to its own Klaviyo account (zenoo.lt). Until these are set, LT quiz
    # results are not sent to Klaviyo; the site's own confirmation email still goes out.
    app.quiz.klaviyo_lt_company_id: '%env(default::KLAVIYO_LT_COMPANY_ID)%'
    app.quiz.klaviyo_lt_list_id: '%env(default::KLAVIYO_LT_LIST_ID)%'
    # Chatbot (/chat). ANTHROPIC_API_KEY switches it on; the prompt is config/chatbot/system_prompt.md.
    chat.default_model: 'claude-haiku-5-5'
    chat.default_base_url: 'https://api.anthropic.com'
    chat.default_daily_limit: 60
    chat.default_timezone: 'Europe/Vilnius'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $appUrl: '%app.url%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Service\EmailService:
        arguments:
            $fromEmail: '%app.mail.from_email%'
            $fromName: '%app.mail.from_name%'

    App\Form\Extension\TurnstileExtension:
        arguments:
            $siteKey: '%app.turnstile.site_key%'
            $secretKey: '%app.turnstile.secret_key%'
            $environment: '%kernel.environment%'
