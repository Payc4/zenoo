# The public "What's new" page (/whats-new, App\Controller\PatchNotesController), newest first.
# One entry per release: date (YYYY-MM-DD), title, items (plain English, one change each).
- date: '2026-11-25'
  title: 'The coach keeps the profile up to date'
  items:
    - 'What you tell the coach about food, daily amounts, meals, treats, activity, symptoms or appetite now updates the dog’s profile, Bowl Score and daily plan, with the same notice as a new weight. A retake starts afresh.'
    - 'Every dog is re-scored under the current rules on each deploy. Older results are rebuilt from what they saved; the few saved too early to rebuild show a “Re-check” notice. A retake of an older dog now starts with its answers filled in.'
    - 'The plan (food, meals, weight goal, protein and fat) is shown in the language of the page, whatever language the quiz was taken in.'
    - 'The energy line no longer seems to contradict a kept amount: with treats counted in it reads “about 560 kcal a day from food, 820 with treats”.'
    - 'The plan email is now sent in English too (it was only sent in Lithuanian, Ukrainian and Polish). The result page no longer promises a feeding guide that isn’t sent.'
    - 'Quiz result: shorter. Confirming the email is the clear next step, with an “Open my email” button for the common email providers; the full plan and breakdown fold away.'
    - 'Coach: a reply that fails before any text appears is tried once more automatically; if it still fails, the message stays on screen with “Try again”. The same fact said in slightly different words is saved once.'
    - 'Label step: one orange button (“Show me”); the AI label reader is a secondary button, and the stray “or type it in yourself” line is gone.'
    - 'Bigger tap targets: the language switch and menu button in the header, and “Edit” in the coach header.'
    - 'Two dogs with the same name are told apart (“Max · Beagle”, or “Max · 2”).'
    - 'Hotjar can be switched on (TRACKING_HOTJAR_ID). It loads only after a visitor allows analytics, and never sees chats, the coach’s notes or account details.'
    - 'This page.'
- date: '2026-11-24'
  title: 'The Bowl Score follows weight and body shape'
  items:
    - 'A new weight or body shape, told to the coach or logged on Today, works the Bowl Score, daily plan and tips out again. Undoing the log puts it back.'
    - 'The change shows under the coach’s reply and as a notice on Today and the dog’s tab until it’s closed; the coach mentions it too.'
    - 'The server uses the same maths as the quiz, checked against it on 4,000 sample dogs.'
- date: '2026-11-20'
  title: 'Photos from any device, and a chat list like a chat app'
  items:
    - 'On a phone, “Take a photo” opens the camera straight away; “Snap the food label” skips the menu.'
    - 'On a computer: choose a file, use the webcam, or “Send from your phone”: scan a QR code, take the photo on the phone, and it lands on the computer.'
    - 'The coach has one chat per dog, listed on the left with each chat’s last line; “New chat” starts one for another dog or adds a dog. On phones the list slides in from the left.'
- date: '2026-11-20'
  title: 'Fixes and improvements from the app test report'
  items:
    - 'Safety: a retake never overwrites the wrong dog; feeding plans never work against body shape and say to ask the vet about big changes; puppies get a growth plan.'
    - 'Coach safety: emergencies are told apart from history, health facts are saved to the dog’s notes, and a second check stops replies that break the dog’s rules.'
    - 'A shorter quiz (about 15 screens) with a reason on every question, and a simpler result.'
    - 'A Today screen, a tab per dog, a bottom tab bar on phones and a calmer coach header.'
    - 'A new home page, previews of the coach and courses before signing up, a simpler sign-up, tagged shop links and link previews.'
    - 'Clean-up: results in the page’s language, score caps explained, a clearer vet report, private dog photos, security headers, self-hosted fonts, one date format per language and clearer email settings.'
- date: '2026-11-19'
  title: 'Several dogs, locked lessons and emails in every language'
  items:
    - 'Several dogs per account, with one coach chat per dog.'
    - 'The last lesson of each course is locked behind a one-off unlock (controlled in the admin).'
    - 'The plan email and the opt-in email series are sent by the site in every language.'
