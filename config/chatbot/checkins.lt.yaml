# Lithuanian wording for the check-in questions in checkins.yaml (same ids and values).
# Timing (every_days, per_visit, repeat_days) and what the coach sees come from checkins.yaml.
# %dog% = the dog's name, always in the nominative, so it stands in brackets or after a colon.

questions:
  - id: goal
    question: "Kuo labiausiai norėtumėte padėti savo šuniui (%dog%)?"
    options:
      - { value: digestion, label: "Geresnis virškinimas" }
      - { value: weight, label: "Sveikas svoris" }
      - { value: skin, label: "Oda ir kailis" }
      - { value: energy, label: "Daugiau energijos" }
      - { value: food_switch, label: "Maisto keitimas" }

  - id: stools
    question: "Kokios šią savaitę buvo jūsų šuns (%dog%) išmatos?"
    options:
      - { value: firm, label: "Kietos, lengva surinkti" }
      - { value: soft, label: "Šiek tiek minkštos" }
      - { value: loose, label: "Skystos" }
      - { value: hard, label: "Labai kietos ar sausos" }

  - id: appetite
    question: "Koks pastaruoju metu jūsų šuns (%dog%) apetitas?"
    options:
      - { value: eager, label: "Viską suėda greitai" }
      - { value: normal, label: "Įprastas" }
      - { value: picky, label: "Išrankus" }
      - { value: low, label: "Ėda nedaug" }

  - id: energy
    question: "Kiek šią savaitę energijos turi jūsų šuo (%dog%)?"
    options:
      - { value: high, label: "Pilnas energijos" }
      - { value: normal, label: "Įprastai" }
      - { value: lower, label: "Mažiau nei įprastai" }
      - { value: very_low, label: "Labai mažai" }

  - id: itching
    question: "Ar pastaruoju metu buvo niežulio, letenų laižymo ar odos problemų?"
    options:
      - { value: none, label: "Nebuvo" }
      - { value: little, label: "Šiek tiek" }
      - { value: lot, label: "Gana daug" }

  - id: food_change
    question: "Ar po testo keitėte savo šuns (%dog%) maistą?"
    options:
      - { value: "no", label: "Ne" }
      - { value: switched, label: "Taip, pakeitėme maistą" }
      - { value: added, label: "Pridėjome priedų ar papildų" }

  - id: weight_change
    question: "Ar pastaruoju metu pasikeitė jūsų šuns (%dog%) svoris?"
    options:
      - { value: same, label: "Maždaug toks pat" }
      - { value: gained, label: "Priaugo" }
      - { value: lost, label: "Sumažėjo" }
      - { value: unsure, label: "Nežinau" }

  - id: exercise
    question: "Kiek įprastą dieną juda jūsų šuo (%dog%)?"
    options:
      - { value: under_30, label: "Mažiau nei 30 min." }
      - { value: "30_60", label: "30–60 min." }
      - { value: 1_2h, label: "1–2 val." }
      - { value: over_2h, label: "Daugiau nei 2 val." }

  - id: treats
    question: "Kiek skanėstų ar maisto nuo stalo jūsų šuo (%dog%) gauna per dieną?"
    options:
      - { value: none, label: "Visai negauna" }
      - { value: few, label: "Šiek tiek" }
      - { value: lots, label: "Gana daug" }

  - id: vet
    question: "Ar šiuo metu jūsų šuo (%dog%) dėl ko nors lankosi pas veterinarą?"
    options:
      - { value: "no", label: "Ne" }
      - { value: digestion, label: "Taip, dėl virškinimo" }
      - { value: skin, label: "Taip, dėl odos ar alergijų" }
      - { value: other, label: "Taip, dėl kito" }
