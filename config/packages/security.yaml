security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|fonts|quiz/assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Email + password (with a per-email/IP attempt limit, see LoginAttemptLimiter).
            custom_authenticators:
                - App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator

            # One-time email login links ("email me a login link").
            login_link:
                check_route: login_check
                # Changing either property invalidates every link already sent.
                signature_properties: ['id', 'lastMagicLinkRequestedAt']
                lifetime: 600 # 10 minutes
                max_uses: 1
                success_handler: App\Security\LoginSuccessHandler

            logout:
                path: app_logout
                target: app_homepage

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 weeks
                # A password change logs out every remembered device.
                signature_properties: ['password']

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/account, roles: ROLE_USER }
        - { path: ^/chat, roles: ROLE_USER }
        - { path: ^/shop/checkout, roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

when@test:
    security:
        password_hashers:
            # Fast hashing in tests only.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
