'%language% only': 'Лише %language%'
'These lessons aren’t in your language yet, so they’re shown in %language%.': 'Цих уроків вашою мовою ще немає, тому вони показані мовою: %language%.'
'Daily energy follows the usual veterinary formula: a factor by activity level (95 to 200 kcal) times the ideal weight to the power of 0.75, 10% less for neutered dogs, a level lower for seniors and for dogs carrying extra weight. The ideal weight comes from the current weight and body shape: each point above 5 means about 10% extra weight.': 'Добова енергія рахується за звичною ветеринарною формулою: коефіцієнт за рівнем активності (від 95 до 200 ккал), помножений на ідеальну вагу в степені 0,75, на 10 % менше для стерилізованих собак, на рівень нижче для літніх собак і собак із зайвою вагою. Ідеальна вага визначається з поточної ваги й статури: кожен бал понад 5 означає приблизно 10 % зайвої ваги.'
'Two caps keep the score honest: a dog a little off ideal shape (body score 3 or 7), or with one or two signs at the bowl, scores at most 79; a dog far from ideal shape (2 or less, 8 or more), or with three or more signs, at most 59. The result says when a cap applies.': 'Два обмеження тримають оцінку чесною: собака трохи не в ідеальній статурі (3 або 7 балів) або з однією-двома ознаками отримує не більше 79; собака далеко від ідеалу (2 і менше, 8 і більше) або з трьома й більше ознаками — не більше 59. У результаті сказано, коли діє обмеження.'
'Puppies have no target weight: their energy for growth comes from today’s weight and the expected adult weight of the breed (NRC 2006), and they should gain steadily.': 'Цуценята не мають цільової ваги: енергія для росту рахується з поточної ваги й очікуваної ваги дорослої собаки породи (NRC 2006), і вага має рівномірно зростати.'
'Body shape sets the direction of the plan: a dog above ideal shape is never told to eat more than now, and a thin dog never less. When the plan would change the amount by more than about 20%, it says to keep today’s amounts and check with your vet instead.': 'Статура визначає напрям плану: собаці з вагою понад ідеал ніколи не радять їсти більше, ніж зараз, а худій — менше. Коли план змінив би кількість більш ніж приблизно на 20 %, він радить залишити нинішні порції й порадитися з ветеринаром.'
