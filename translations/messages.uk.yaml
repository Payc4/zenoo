'Carbohydrates': 'Вуглеводи'
'Carbohydrates worked out from the label (100 minus protein, fat, fibre, ash and moisture), on a dry-matter basis: 15% or less scores full marks, over 45% the least.': 'Вуглеводи, розраховані за етикеткою (100 мінус білок, жир, клітковина, зола й волога), у перерахунку на суху речовину: 15% або менше — повні бали, понад 45% — найменше.'
'How processed the main food is: dry food, then wet, then fresh or home-cooked, then raw or freeze-dried. Adding a fresher food to the bowl adds a little.': 'Наскільки оброблений основний корм: сухий, потім вологий, потім свіжий чи домашній, потім сирий чи сублімований. Свіжіша добавка до миски додає трохи балів.'
'The 9-point body condition score from the shape you pick: 5 (ideal) scores full marks, 4 and 6 a little less, further from 5 less again.': '9-бальна шкала статури за формою, яку ви обираєте: 5 (ідеально) — повні бали, 4 і 6 — трохи менше, далі від 5 — ще менше.'
'Daily walks and play compared with what the breed typically needs (a step less for puppies and seniors).': 'Щоденні прогулянки й ігри порівняно з тим, що зазвичай потрібно породі (для цуценят і сеньйорів — на крок менше).'
'Signs': 'Ознаки'
'Appetite and everyday signs such as itching, soft stools or a dull coat: each sign takes a point off.': 'Апетит і щоденні ознаки, як-от свербіж, м’які випорожнення чи тьмяна шерсть: кожна ознака знімає бал.'
'Portions and routine': 'Порції та режим'
'How close the daily amount is to the dog’s energy needs, a regular meal pattern, and how many treats.': 'Наскільки денна кількість відповідає потребі в енергії, регулярність годувань і скільки ласощів.'
'Scores of 80 and above are “great”, 60–79 “good”, 40–59 “worth a closer look” and under 40 “easy wins ahead”.': '80 і більше — «чудово», 60–79 — «добре», 40–59 — «варто придивитися», менше 40 — «попереду легкі перемоги».'
'Energy and portions': 'Енергія та порції'
'Daily energy follows the usual veterinary formula: a factor by activity level (95 to 200 kcal) times the ideal weight to the power of 0.75, 10% less for neutered dogs, a level lower for seniors and for dogs carrying extra weight. Puppies get 2–3 times their resting energy. The ideal weight comes from the current weight and body shape: each point above 5 means about 10% extra weight.': 'Денна енергія рахується за звичною ветеринарною формулою: коефіцієнт за активністю (від 95 до 200 ккал), помножений на ідеальну вагу в степені 0,75, на 10% менше для кастрованих чи стерилізованих собак, на рівень нижче для сеньйорів і собак із зайвою вагою. Цуценятам — у 2–3 рази більше від енергії спокою. Ідеальна вага визначається з поточної ваги та статури: кожен бал понад 5 означає приблизно 10% зайвої ваги.'
'Energy in the food is worked out from the label with the modified Atwater factors (3.5 kcal per gram of protein and carbohydrate, 8.5 per gram of fat). The coach and the ZENOO plan use the same maths.': 'Енергія корму рахується за етикеткою з модифікованими коефіцієнтами Атвотера (3,5 ккал на грам білка й вуглеводів, 8,5 — на грам жиру). Помічник і план ZENOO використовують ту саму математику.'
'Its limits': 'Обмеження'
'If you skip the label, the quiz uses typical values for the type of food. With typical dry-food values the highest possible score is 69 (“good”): dry food can only reach the top band when its label shows high protein and few carbohydrates. That is a feature of the method, not a verdict on a particular brand.': 'Якщо ви пропускаєте етикетку, тест бере типові значення для такого виду корму. З типовими значеннями сухого корму найвищий можливий бал — 69 («добре»): сухий корм досягає найвищого рівня лише тоді, коли на етикетці багато білка й мало вуглеводів. Це властивість методики, а не оцінка конкретного бренду.'
'Protein and carbohydrates say a lot, but not everything: ingredient quality, digestibility and what suits one dog aren’t in the score.': 'Білок і вуглеводи кажуть багато, але не все: якість інгредієнтів, засвоюваність і те, що пасує конкретному собаці, у бал не входять.'
'The Bowl Score is a starting point for better feeding, not a diagnosis. For health problems, puppies, pregnancy and dogs with a medical condition, please talk to your vet.': 'Bowl Score — це відправна точка для кращого годування, а не діагноз. Щодо проблем зі здоров’ям, цуценят, вагітності та собак із хворобами порадьтеся з ветеринаром.'
'Sources': 'Джерела'
'Energy and nutrient guidance follows the FEDIAF Nutritional Guidelines, the NRC Nutrient Requirements of Dogs and Cats and the WSAVA Global Nutrition Guidelines. The points for each part are ZENOO’s own weighting, published here so it can be checked.': 'Рекомендації щодо енергії та поживних речовин спираються на настанови FEDIAF, NRC «Nutrient Requirements of Dogs and Cats» і глобальні настанови WSAVA з харчування. Бали для кожної частини — власні ваги ZENOO, опубліковані тут, щоб їх можна було перевірити.'
