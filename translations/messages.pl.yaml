'These lessons aren’t in your language yet, so they’re shown in %language%.': 'Tych lekcji nie ma jeszcze w twoim języku, więc są pokazane w języku: %language%.'
'Daily energy follows the usual veterinary formula: a factor by activity level (95 to 200 kcal) times the ideal weight to the power of 0.75, 10% less for neutered dogs, a level lower for seniors and for dogs carrying extra weight. The ideal weight comes from the current weight and body shape: each point above 5 means about 10% extra weight.': 'Dzienna energia liczona jest zwykłym wzorem weterynaryjnym: współczynnik zależny od aktywności (od 95 do 200 kcal) razy idealna waga do potęgi 0,75, 10% mniej dla psów kastrowanych, o poziom mniej dla seniorów i psów z nadwagą. Idealna waga wynika z obecnej wagi i sylwetki: każdy punkt powyżej 5 to około 10% nadwagi.'
'Two caps keep the score honest: a dog a little off ideal shape (body score 3 or 7), or with one or two signs at the bowl, scores at most 79; a dog far from ideal shape (2 or less, 8 or more), or with three or more signs, at most 59. The result says when a cap applies.': 'Dwa limity utrzymują uczciwy wynik: pies trochę poza idealną sylwetką (3 lub 7 punktów) albo z jednym-dwoma objawami dostaje najwyżej 79; pies daleko od ideału (2 lub mniej, 8 lub więcej) albo z trzema i więcej objawami – najwyżej 59. Wynik mówi, kiedy limit działa.'
'Puppies have no target weight: their energy for growth comes from today’s weight and the expected adult weight of the breed (NRC 2006), and they should gain steadily.': 'Szczenięta nie mają docelowej wagi: energia na wzrost wynika z obecnej wagi i spodziewanej wagi dorosłego psa danej rasy (NRC 2006), a waga powinna równomiernie rosnąć.'
'Body shape sets the direction of the plan: a dog above ideal shape is never told to eat more than now, and a thin dog never less. When the plan would change the amount by more than about 20%, it says to keep today’s amounts and check with your vet instead.': 'Sylwetka wyznacza kierunek planu: psu powyżej idealnej sylwetki nigdy nie zaleca się jeść więcej niż teraz, a chudemu mniej. Gdy plan zmieniłby ilość o więcej niż około 20%, zaleca zostawić obecne porcje i skonsultować się z weterynarzem.'
