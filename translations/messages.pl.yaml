# Open method, vet report, sharing
'How the Bowl Score works': 'Jak działa Bowl Score'
'How does your dog’s bowl score? Take the free 3-minute ZENOO quiz.': 'Jak wypada miska Twojego psa? Zrób darmowy, 3-minutowy quiz ZENOO.'
'Check my dog’s Bowl Score': 'Sprawdź Bowl Score mojego psa'
'The open method behind the ZENOO Bowl Score: what it measures, how many points each part is worth, and its limits.': 'Otwarta metoda ZENOO Bowl Score: co mierzy, ile punktów jest warta każda część i jakie ma ograniczenia.'
'Open method': 'Otwarta metoda'
'The Bowl Score is a quick check of a dog’s food and routine, out of 100. Here is exactly how it’s worked out, so you can judge it for yourself.': 'Bowl Score to szybkie sprawdzenie karmy i rytmu dnia psa, w skali do 100. Oto dokładnie, jak jest liczony, żebyś mógł(-a) ocenić go sam(a).'
'Method reviewed by %vet%.': 'Metodę sprawdził(-a) %vet%.'
'The seven parts': 'Siedem części'
'Part': 'Część'
'Points': 'Punkty'
'What counts': 'Co się liczy'
'Protein in the main food, on a dry-matter basis: 35% or more scores full marks, under 25% the least.': 'Białko w głównej karmie, w przeliczeniu na suchą masę: 35% i więcej to pełna pula, poniżej 25% najmniej.'
'Carbohydrates': 'Węglowodany'
'Carbohydrates worked out from the label (100 minus protein, fat, fibre, ash and moisture), on a dry-matter basis: 15% or less scores full marks, over 45% the least.': 'Węglowodany wyliczone z etykiety (100 minus białko, tłuszcz, włókno, popiół i wilgotność), w przeliczeniu na suchą masę: 15% lub mniej to pełna pula, powyżej 45% najmniej.'
'How processed the main food is: dry food, then wet, then fresh or home-cooked, then raw or freeze-dried. Adding a fresher food to the bowl adds a little.': 'Jak przetworzona jest główna karma: sucha, potem mokra, potem świeża lub domowa, potem surowa lub liofilizowana. Dodatek świeższej karmy do miski dodaje trochę.'
'The 9-point body condition score from the shape you pick: 5 (ideal) scores full marks, 4 and 6 a little less, further from 5 less again.': '9-punktowa skala kondycji ciała według wybranej sylwetki: 5 (ideał) to pełna pula, 4 i 6 nieco mniej, dalej od 5 jeszcze mniej.'
'Daily walks and play compared with what the breed typically needs (a step less for puppies and seniors).': 'Codzienne spacery i zabawa w porównaniu z tym, czego zwykle potrzebuje rasa (dla szczeniąt i seniorów o stopień mniej).'
'Signs': 'Objawy'
'Appetite and everyday signs such as itching, soft stools or a dull coat: each sign takes a point off.': 'Apetyt i codzienne objawy, takie jak swędzenie, miękki kał czy matowa sierść: każdy objaw odejmuje punkt.'
'Portions and routine': 'Porcje i rytm dnia'
'How close the daily amount is to the dog’s energy needs, a regular meal pattern, and how many treats.': 'Na ile dzienna ilość odpowiada potrzebom energetycznym psa, regularność posiłków i ilość przysmaków.'
'Scores of 80 and above are “great”, 60–79 “good”, 40–59 “worth a closer look” and under 40 “easy wins ahead”.': '80 i więcej to „świetnie”, 60–79 „dobrze”, 40–59 „warto przyjrzeć się bliżej”, poniżej 40 „łatwe zwycięstwa przed Tobą”.'
'Energy and portions': 'Energia i porcje'
'Daily energy follows the usual veterinary formula: a factor by activity level (95 to 200 kcal) times the ideal weight to the power of 0.75, 10% less for neutered dogs, a level lower for seniors and for dogs carrying extra weight. Puppies get 2–3 times their resting energy. The ideal weight comes from the current weight and body shape: each point above 5 means about 10% extra weight.': 'Dzienna energia liczona jest zwykłym wzorem weterynaryjnym: współczynnik według aktywności (od 95 do 200 kcal) razy idealna waga do potęgi 0,75, 10% mniej dla psów kastrowanych lub sterylizowanych, poziom niżej dla seniorów i psów z nadwagą. Szczenięta dostają 2–3 razy więcej niż energia spoczynkowa. Idealna waga wynika z obecnej wagi i sylwetki: każdy punkt powyżej 5 oznacza około 10% nadwagi.'
'Energy in the food is worked out from the label with the modified Atwater factors (3.5 kcal per gram of protein and carbohydrate, 8.5 per gram of fat). The coach and the ZENOO plan use the same maths.': 'Energia karmy liczona jest z etykiety zmodyfikowanymi współczynnikami Atwatera (3,5 kcal na gram białka i węglowodanów, 8,5 na gram tłuszczu). Asystent i plan ZENOO używają tej samej matematyki.'
'Its limits': 'Ograniczenia'
'If you skip the label, the quiz uses typical values for the type of food. With typical dry-food values the highest possible score is 69 (“good”): dry food can only reach the top band when its label shows high protein and few carbohydrates. That is a feature of the method, not a verdict on a particular brand.': 'Jeśli pominiesz etykietę, quiz używa typowych wartości dla danego rodzaju karmy. Przy typowych wartościach suchej karmy najwyższy możliwy wynik to 69 („dobrze”): sucha karma osiąga najwyższy poziom tylko wtedy, gdy etykieta pokazuje dużo białka i mało węglowodanów. To cecha metody, a nie ocena konkretnej marki.'
'Protein and carbohydrates say a lot, but not everything: ingredient quality, digestibility and what suits one dog aren’t in the score.': 'Białko i węglowodany mówią dużo, ale nie wszystko: jakość składników, strawność i to, co służy konkretnemu psu, nie wchodzą do wyniku.'
'The Bowl Score is a starting point for better feeding, not a diagnosis. For health problems, puppies, pregnancy and dogs with a medical condition, please talk to your vet.': 'Bowl Score to punkt wyjścia do lepszego żywienia, a nie diagnoza. W sprawie problemów zdrowotnych, szczeniąt, ciąży i psów z chorobami porozmawiaj z weterynarzem.'
'Sources': 'Źródła'
'Energy and nutrient guidance follows the FEDIAF Nutritional Guidelines, the NRC Nutrient Requirements of Dogs and Cats and the WSAVA Global Nutrition Guidelines. The points for each part are ZENOO’s own weighting, published here so it can be checked.': 'Wytyczne dotyczące energii i składników odżywczych opierają się na wytycznych FEDIAF, NRC „Nutrient Requirements of Dogs and Cats” i globalnych wytycznych żywieniowych WSAVA. Punkty dla każdej części to własne wagi ZENOO, opublikowane tutaj, żeby można je było sprawdzić.'
