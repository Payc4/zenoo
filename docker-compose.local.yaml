# LOCAL DEVELOPMENT ONLY. Not for Coolify: production uses the Dockerfile build pack (see DEPLOY.md).
# The name is deliberately not docker-compose.yaml, so hosting tools don't pick it up by mistake.
#
#   docker compose -f docker-compose.local.yaml up
#
# Site: http://localhost:8080   Emails (Mailpit): http://localhost:8025
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-dev-secret-not-for-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: "mysql://zenoo:${MYSQL_PASSWORD:-zenoo_local}@database:3306/zenoo?serverVersion=8.0.32&charset=utf8mb4"
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MAILER_DSN: smtp://mailer:1025
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 5s
      retries: 3

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zenoo
      MYSQL_USER: zenoo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zenoo_local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database_data:/var/lib/mysql:rw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  # Catches every email the app sends.
  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
