# Catches every email the app sends during local development: http://localhost:8025
# Set MAILER_DSN=smtp://mailer:1025 for the app service to use it.
services:
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
